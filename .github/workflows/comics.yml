name: comics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: comics
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
      revision: ${{ steps.save.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr > /dev/null
          pip install -q pillow numpy opencv-python-headless pytesseract kiwipiepy
      - name: inbox 처리
        run: python tools/process.py
      - name: Pages 배포 방식 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          case "$mode" in legacy|workflow) ;; *) echo "Unknown Pages mode: $mode"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: 저장
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_MODE: ${{ steps.pages.outputs.mode }}
        run: |
          git config user.name "comics-bot"
          git config user.email "comics-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "새 만화 반영"
          fi
          api="repos/$GITHUB_REPOSITORY"
          if [[ "$PAGES_MODE" == legacy ]]; then
            pages_workflow=$(gh api "$api/actions/workflows" --paginate --jq '.workflows[] | select(.path == "dynamic/pages/pages-build-deployment") | .id')
            test -n "$pages_workflow"
          fi

          # The upload commit can still be publishing the pre-processing list.
          # Finish its branch build before creating a new publishable revision.
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            git fetch origin main
            tip=$(git rev-parse origin/main)
            git rebase "$tip"

            if [[ "$PAGES_MODE" == legacy ]]; then
              runs="$api/actions/workflows/$pages_workflow/runs?branch=main"
              if [[ "$GITHUB_EVENT_NAME" == push && "$(git show -s --format=%ae "$tip")" != "comics-bot@users.noreply.github.com" ]]; then
                started=$(gh api "$runs&head_sha=$tip&per_page=1" --jq .total_count)
                if (( started == 0 )); then sleep 10; continue; fi
              fi
              active=$(gh api "$runs&per_page=100" --paginate --jq '.workflow_runs[] | select(.status != "completed") | .id')
              if [[ -n "$active" ]]; then sleep 10; continue; fi
            fi

            rev=$(git rev-parse HEAD)
            if ! git push origin HEAD:main; then
              git fetch origin main
              if [[ "$(git rev-parse origin/main)" == "$tip" ]]; then exit 1; fi
              continue
            fi
            echo "revision=$rev" >> "$GITHUB_OUTPUT"
            if [[ "$PAGES_MODE" == legacy && ( "$rev" != "$tip" || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
              if ! gh api --method POST "$api/pages/builds" --jq .status; then
                # A branch build may already have been queued by the push.
                existing=$(gh api "$runs&head_sha=$rev&per_page=1" --jq '.workflow_runs[0] | .status != null and (.status != "completed" or .conclusion == "success")')
                [[ "$existing" == true ]] || exit 1
              fi
            fi
            exit 0
          done
          echo "::error::Timed out waiting for older Pages builds to finish."
          exit 1

  deploy:
    needs: process
    if: needs.process.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.process.outputs.revision }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
