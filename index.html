<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>혐규만화</title>
<meta name="description" content="혐규만화 전편 보관소">
<meta property="og:title" content="혐규만화">
<meta property="og:description" content="혐규만화 전편 보관소">
<meta property="og:image" content="img/0009.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%23fff' stroke='%23000' stroke-width='3'/%3E%3Cpath d='M2 16h28M16 2v28' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEBE6; --ink:#000; --white:#fff; --mark:#FFD500; --mute:#6b6b66;
  --top:56px; --bar:74px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500;font-size:15px;line-height:1.4;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* ---------- top ---------- */
#top{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + var(--sat));padding:calc(10px + var(--sat)) 12px 0;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none}
#top>*{pointer-events:auto}
#logo{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:22px;letter-spacing:.5px;line-height:1;padding:8px 10px 6px;position:relative;text-decoration:none;display:inline-block}
#logo::before{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:11px;background:var(--mark);z-index:-1;transform:skewX(-8deg)}
.round{width:40px;height:40px;border-radius:50%;background:var(--white);border:2.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink);margin-left:8px;transition:transform .08s}
.round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.round.on{background:var(--mark)}
.round svg{width:20px;height:20px}
svg.ic{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- stage (single comic) ---------- */
#stage{position:fixed;inset:0;padding:calc(var(--top) + var(--sat)) 16px calc(var(--bar) + 22px + var(--sab));display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#stage.show{display:flex}
#frame{margin:auto;flex-shrink:0;width:600px;max-width:100%;display:flex;flex-direction:column;gap:18px;padding:0 10px 10px 0}
#frame img{display:block;width:100%;height:auto;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);background:var(--white)}
#frame.empty{width:min(80vw,420px);aspect-ratio:1;background:var(--white);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);align-items:center;justify-content:center;line-height:1.4;font-size:14px;color:var(--mute);text-align:center;padding:20px}
.edge{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;display:none;align-items:center;justify-content:center;background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);z-index:15}
.edge svg{width:22px;height:22px}
#edgeL{left:14px}#edgeR{right:14px}
@media(min-width:900px){body.inlist .edge{display:flex}}

/* ---------- bottom bar ---------- */
#bar{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);display:none;background:var(--white);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:4px;gap:2px;z-index:20;max-width:calc(100vw - 20px)}
#bar.show{display:flex}
#bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:58px;padding:0 5px;font-size:11px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;border:2px solid transparent;transition:background .06s}
#bar button svg{width:22px;height:22px}
#bar button:active,#bar button.on{background:var(--mark)}
#bar button.star.on svg{fill:var(--ink)}
#bar button[hidden]{display:none}

/* ---------- lists ---------- */
#list{display:none;padding:calc(var(--top) + var(--sat) + 8px) 12px calc(40px + var(--sab));max-width:1180px;margin:0 auto}
#list.show{display:block}
#lhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
#lhead .t{font-weight:700;font-size:15px;margin-right:4px}
#lhead .n{color:var(--mute);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--white);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:13px;font-weight:700;transition:transform .06s}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.chip.on{background:var(--mark)}
.chip .box{width:14px;height:14px;border:2px solid var(--ink);background:var(--white);display:inline-block}
.chip.on .box{background:var(--ink)}
#search{display:none;margin:0 0 14px}
#search.show{display:block}
#q{width:100%;height:50px;border:3px solid var(--ink);background:var(--white);box-shadow:4px 4px 0 var(--ink);padding:0 14px;font:inherit;font-size:17px;font-weight:700;outline:none}
#q::placeholder{color:#a6a6a0;font-weight:500}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
@media(min-width:600px){#grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}}
#grid a{display:block;aspect-ratio:1;background:var(--white);border:2px solid var(--ink);overflow:hidden;transition:transform .06s}
#grid a:active{transform:translate(1px,1px)}
#grid a img{width:100%;height:100%;object-fit:contain}
#grid a{position:relative}
#grid a .pg{position:absolute;right:4px;bottom:4px;min-width:20px;height:20px;padding:0 5px;background:var(--ink);color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
#empty{padding:60px 10px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
#more{display:block;margin:20px auto 0;height:44px;padding:0 20px;background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-weight:700}
#more[hidden]{display:none}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 26px + var(--sab));transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--white);padding:9px 14px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30;white-space:nowrap;max-width:calc(100vw - 24px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="top">
  <a id="logo" href="#" aria-label="혐규만화 처음으로">혐규만화</a>
  <div>
    <button class="round" id="bSearch" aria-label="검색"><svg class="ic" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    <button class="round" id="bBrowse" aria-label="열람"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg></button>
  </div>
</div>

<div id="stage">
  <div id="frame"></div>
</div>
<button class="edge" id="edgeL" aria-label="이전"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="edge" id="edgeR" aria-label="다음"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<div id="list">
  <div id="search"><input id="q" type="search" placeholder="대사나 낱말" autocomplete="off" enterkeyhint="search"></div>
  <div id="lhead"></div>
  <div id="grid"></div>
  <div id="empty" hidden></div>
  <button id="more" hidden>더 보기</button>
</div>

<div id="bar">
  <button id="bList" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>목록</button>
  <button id="bPrev" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>이전</button>
  <button id="bNext" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>다음</button>
  <button id="bRandom"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/></svg>다른 거</button>
  <button id="bSim"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="12" height="12"/><path d="M8.5 7.5v-4h12v12h-4"/></svg>비슷한 거</button>
  <button id="bBm" class="star"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z"/></svg>북마크</button>
  <button id="bSave"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg>저장</button>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const el={stage:$('#stage'),frame:$('#frame'),list:$('#list'),grid:$('#grid'),lhead:$('#lhead'),empty:$('#empty'),more:$('#more'),search:$('#search'),q:$('#q'),bar:$('#bar'),toast:$('#toast'),
  bSearch:$('#bSearch'),bBrowse:$('#bBrowse'),bList:$('#bList'),bPrev:$('#bPrev'),bNext:$('#bNext'),bRandom:$('#bRandom'),bSim:$('#bSim'),bBm:$('#bBm'),bSave:$('#bSave'),edgeL:$('#edgeL'),edgeR:$('#edgeR'),logo:$('#logo')};

/* ---------- storage: this browser only ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const seen=new Set(store.get('hg_seen',[]));
const bm=new Set(store.get('hg_bm',[]));
const saveSeen=()=>store.set('hg_seen',[...seen]);
const saveBm=()=>store.set('hg_bm',[...bm]);

/* ---------- data ---------- */
const comics=[];          // {id, kw:Set, kwn:[], norm}
const byId=new Map();
const norm=s=>(s||'').normalize('NFC').toLowerCase().replace(/[^0-9a-z가-힣]/g,'');
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function load(){
  const r=await fetch('list.csv');
  if(!r.ok) throw new Error('list.csv '+r.status);
  const rows=parseCSV(await r.text());
  const h=rows[0].map(s=>s.trim());
  const ix={id:h.indexOf('id'),hidden:h.indexOf('hidden'),kw:h.indexOf('keywords'),text:h.indexOf('text'),ep:h.indexOf('episode'),pg:h.indexOf('page')};
  const pages=[];
  for(const row of rows.slice(1)){
    const id=(row[ix.id]||'').trim(); if(!id) continue;
    if(ix.hidden>=0 && (row[ix.hidden]||'').trim()) continue;
    pages.push({id,kws:(row[ix.kw]||'').split(/[\s,]+/).filter(Boolean),text:row[ix.text]||'',ep:ix.ep>=0?(row[ix.ep]||'').trim():'',pg:ix.pg>=0?parseInt(row[ix.pg]||'0',10)||0:0});
  }
  // 여러 장짜리 만화: episode 칸이 같은 줄들을 한 편으로 묶는다 (episode 값 = 첫 장 번호)
  const groups=new Map();
  for(const p of pages){ const key=p.ep||p.id; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(p); }
  for(const [key,ps] of groups){
    ps.sort((a,b)=>(a.pg-b.pg)||(a.id<b.id?-1:1));
    const first=byIdPage(ps,key);
    const kws=[...new Set(ps.flatMap(p=>p.kws))];
    const c={id:first.id,pages:ps.map(p=>p.id),kw:new Set(kws),kwn:kws.map(norm),norm:ps.map(p=>norm(p.text)).join('|')+'|'+kws.map(norm).join('|')};
    if(byId.has(c.id)) continue;
    comics.push(c);byId.set(c.id,c);
    for(const p of ps) pageOf.set(p.id,c);
  }
}
const pageOf=new Map();
function byIdPage(ps,key){ return ps.find(p=>p.id===key)||ps[0]; }

/* ---------- random ---------- */
function seeded(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let nextPick=null;
function pickRandom(exclude){
  let pool=comics.filter(c=>!seen.has(c.id)&&c.id!==exclude);
  let allDone=false;
  if(!pool.length){allDone=true;pool=comics.filter(c=>c.id!==exclude);}
  if(!pool.length) pool=comics;
  return {c:pool[Math.floor(Math.random()*pool.length)],allDone};
}
function preload(){
  nextPick=pickRandom(cur?cur.id:null);
  const im=new Image(); im.src='img/'+nextPick.c.id+'.png';
}

/* ---------- state ---------- */
let cur=null;            // comic on the stage
let ctx=null;            // list context {kind, ids, title, index, extra}
let view='home';         // 'home' | 'viewer' | 'list'
let shown=0;
const PAGE=120;

function fitWidth(){
  // 가로 폭 우선: 정사각형 만화가 화면에 딱 맞는 폭을 기준으로 잡고, 그보다 세로로 긴 만화는 같은 폭으로 두고 스크롤한다
  const cs=getComputedStyle(el.stage);
  const w=el.stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=el.stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  el.frame.style.width=Math.max(220,Math.min(w,h-14))+'px';
}
window.addEventListener('resize',()=>{ if(view!=='list') fitWidth(); });
function setView(v){
  view=v;
  const isList=v==='list', inList=v==='viewer';
  el.stage.classList.toggle('show',!isList);
  el.bar.classList.toggle('show',!isList);
  el.list.classList.toggle('show',isList);
  document.body.classList.toggle('inlist',inList);
  el.bBrowse.classList.toggle('on',isList&&!!ctx&&ctx.kind!=='search');
  el.bSearch.classList.toggle('on',isList&&!!ctx&&ctx.kind==='search');
  el.bList.hidden=!inList;el.bPrev.hidden=!inList;el.bNext.hidden=!inList;el.bRandom.hidden=inList;
}

function show(c,opts){
  opts=opts||{};
  cur=c;
  el.frame.classList.remove('empty');
  el.frame.innerHTML='';
  setView(ctx?'viewer':'home');
  fitWidth();
  c.pages.forEach((pid,i)=>{
    const im=document.createElement('img'); im.alt='혐규만화'; im.draggable=false; im.decoding='async';
    if(i>0) im.loading='lazy';
    im.onerror=()=>toast('이미지를 못 불러왔어요');
    im.src='img/'+pid+'.png';
    el.frame.appendChild(im);
  });
  el.stage.scrollTop=0;
  seen.add(c.id); saveSeen();
  el.bBm.classList.toggle('on',bm.has(c.id));
  if(opts.push) history.pushState({id:c.id,ctx:ctx?{kind:ctx.kind,extra:ctx.extra,ids:(ctx.kind==='sim'||ctx.kind==='import')?ctx.ids:null}:null},'','#'+c.id);
  if(!ctx) preload();
}

function goRandom(){
  ctx=null;
  if(location.hash) history.replaceState({},'',location.pathname+location.search);
  const p=nextPick||pickRandom(cur?cur.id:null); nextPick=null;
  if(p.allDone) toast(comics.length+'편 다 봤어요. 처음부터 다시 나와요');
  show(p.c);
}

/* ---------- lists ---------- */
function openList(kind,ids,title,extra,focusCur){
  ctx={kind,ids,title,index:-1,extra:extra||{}};
  if(cur){ const i=ids.indexOf(cur.id); if(i>=0) ctx.index=i; }
  setView('list');
  renderList();
  if(focusCur&&ctx.index>=0){ while(shown<=ctx.index) renderMore(); scrollToCurrent(); } else window.scrollTo(0,0);
}
function chip(label,on,cb){
  const b=document.createElement('button');b.className='chip'+(on?' on':'');
  const box=document.createElement('span');box.className='box';b.appendChild(box);b.appendChild(document.createTextNode(label));
  b.onclick=()=>{b.classList.toggle('on');cb(b.classList.contains('on'))};
  return b;
}
function listHead(){
  const c=ctx, h=el.lhead; h.innerHTML='';
  const t=document.createElement('span');t.className='t';t.textContent=c.title;h.appendChild(t);
  const n=document.createElement('span');n.className='n';n.textContent=c.ids.length?c.ids.length.toLocaleString()+'편':'';h.appendChild(n);
  if(c.kind==='browse'){
    h.appendChild(chip('안 본 것만',store.get('hg_unseen',false),v=>{store.set('hg_unseen',v);ctx.ids=browseIds();ctx.index=-1;renderList();window.scrollTo(0,0);}));
    h.appendChild(chip('북마크만',false,()=>{location.hash='#bm';}));
  }
  if(c.kind==='bm'&&c.ids.length){
    const b=document.createElement('button');b.className='chip';b.textContent='북마크 링크 복사';
    b.onclick=()=>copy(location.origin+location.pathname+'#bm/'+[...bm].join(','),'북마크 링크를 복사했어요');
    h.appendChild(b);
  }
  if(c.kind==='import'){
    const b=document.createElement('button');b.className='chip';b.textContent='내 북마크에 담기';
    b.onclick=()=>{c.ids.forEach(id=>bm.add(id));saveBm();toast('북마크에 담았어요');};
    h.appendChild(b);
  }
}
function renderList(){
  listHead();
  el.grid.innerHTML='';shown=0;
  el.empty.hidden=true;
  if(!ctx.ids.length){
    el.empty.hidden=false;
    const q=ctx.extra.q||'';
    el.empty.textContent=ctx.kind==='search'?(q?(norm(q).length<2?'두 글자 이상 넣어 주세요':'"'+q+'"가 들어간 만화가 없어요'):'대사나 낱말을 넣으면 바로 나와요'):ctx.kind==='bm'?'북마크한 만화가 없어요. 만화 아래 ☆를 누르면 여기 모여요':ctx.kind==='browse'?'안 본 만화가 없어요. 다 봤어요':'없어요';
  }
  renderMore();
}
function renderMore(){
  const ids=ctx.ids.slice(shown,shown+PAGE);
  const frag=document.createDocumentFragment();
  ids.forEach((id,i)=>{
    const a=document.createElement('a');a.href='#'+id;a.setAttribute('aria-label','만화 열기');
    const im=document.createElement('img');im.loading='lazy';im.decoding='async';im.src='thumb/'+id+'.jpg';im.alt='';
    a.appendChild(im);
    const u=byId.get(id); if(u&&u.pages.length>1){ const b=document.createElement('span'); b.className='pg'; b.textContent=u.pages.length; a.appendChild(b); }
    const idx=shown+i;
    a.onclick=e=>{e.preventDefault();ctx.index=idx;show(byId.get(id),{push:true});};
    frag.appendChild(a);
  });
  el.grid.appendChild(frag);shown+=ids.length;
  el.more.hidden=shown>=ctx.ids.length;
}
el.more.onclick=renderMore;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&!el.more.hidden&&view==='list') renderMore();},{rootMargin:'600px'}).observe(el.more);

function browseIds(){
  let seed=sessionStorage.getItem('hg_seed');
  if(!seed){seed=String(Math.floor(Math.random()*1e9));sessionStorage.setItem('hg_seed',seed);}
  let ids=shuffle(comics.map(c=>c.id),seeded(+seed));
  if(store.get('hg_unseen',false)) ids=ids.filter(id=>!seen.has(id));
  return ids;
}
let idf=null;
function similar(c){
  if(!idf){ const df=new Map(); for(const o of comics) for(const k of o.kw) df.set(k,(df.get(k)||0)+1); idf=new Map(); for(const [k,n] of df) idf.set(k,1/Math.log(1+n)); }
  const scored=[];
  for(const o of comics){
    if(o===c) continue;
    let s=0; for(const k of c.kw) if(o.kw.has(k)) s+=idf.get(k)||0;
    if(s>0) scored.push([s,Math.random(),o.id]);
  }
  scored.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  const ids=scored.slice(0,40).map(x=>x[2]);
  if(ids.length<12){ const pool=shuffle(comics.filter(o=>o!==c&&!ids.includes(o.id)).map(o=>o.id),Math.random); while(ids.length<12&&pool.length) ids.push(pool.pop()); }
  return ids;
}
function search(q){
  if(norm(q).length<2) return [];
  const terms=q.trim().split(/\s+/).map(norm).filter(Boolean);
  const kwHit=[],txtHit=[];
  for(const c of comics){
    if(terms.every(t=>c.norm.includes(t))) (terms.some(t=>c.kwn.some(k=>k.includes(t)))?kwHit:txtHit).push(c.id);
  }
  return kwHit.concat(txtHit);
}

/* ---------- actions ---------- */
function step(d){
  if(!ctx||ctx.index<0) return;
  const i=ctx.index+d;
  if(i<0||i>=ctx.ids.length){toast(d>0?'마지막이에요':'첫 번째예요');return;}
  ctx.index=i; show(byId.get(ctx.ids[i]),{push:true});
}
function save(c){
  c.pages.forEach((pid,i)=>{
    setTimeout(()=>{ const a=document.createElement('a');a.href='img/'+pid+'.png';a.download='혐규만화_'+c.id+(c.pages.length>1?'_'+(i+1):'')+'.png';document.body.appendChild(a);a.click();a.remove(); }, i*600);
  });
}
function copy(text,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg),()=>prompt('복사해 두세요',text));
  else prompt('복사해 두세요',text);
}
let toastT=null;
function toast(msg){el.toast.textContent=msg;el.toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.toast.classList.remove('show'),1800);}
function rebuild(sc,id){
  let ids=[], title='';
  switch(sc.kind){
    case 'browse': ids=browseIds(); title='열람'; break;
    case 'search': ids=search(sc.extra.q||''); title='검색'; break;
    case 'bm': ids=[...bm]; title='북마크'; break;
    case 'sim': ids=sc.ids||[]; title='비슷한 만화'; break;
    case 'import': ids=sc.ids||[]; title='받은 북마크'; break;
  }
  const i=ids.indexOf(id);
  if(i<0) return null;
  return {kind:sc.kind,ids,title,index:i,extra:sc.extra||{}};
}
function ctxHash(){ if(!ctx) return '#'; switch(ctx.kind){case 'browse':return '#b';case 'sim':return '#sim/'+ctx.extra.id;case 'search':return '#s/'+encodeURIComponent(ctx.extra.q||'');case 'bm':return '#bm';case 'import':return '#bm/'+ctx.ids.join(',');} return '#'; }
function scrollToCurrent(){ if(!cur) return; const a=el.grid.querySelector('a[href="#'+cur.id+'"]'); if(a) a.scrollIntoView({block:'center'}); }

el.bRandom.onclick=goRandom;
el.bSim.onclick=()=>{ if(cur) location.hash='#sim/'+cur.id; };
el.bBm.onclick=()=>{ if(!cur) return; if(bm.has(cur.id)){bm.delete(cur.id);toast('북마크에서 뺐어요');}else{bm.add(cur.id);toast('북마크했어요');} saveBm(); el.bBm.classList.toggle('on',bm.has(cur.id)); };
el.bSave.onclick=()=>{ if(cur) save(cur); };
el.bList.onclick=()=>{ if(!ctx) return; const keep=ctx; history.pushState({},'',ctxHash()); openList(keep.kind,keep.ids,keep.title,keep.extra,true); if(keep.kind==='search') el.search.classList.add('show'); };
el.bPrev.onclick=()=>step(-1); el.bNext.onclick=()=>step(1);
el.edgeL.onclick=()=>step(-1); el.edgeR.onclick=()=>step(1);
el.bSearch.onclick=()=>{ location.hash='#s'; };
el.bBrowse.onclick=()=>{ location.hash='#b'; };
el.logo.onclick=e=>{e.preventDefault();goRandom();};

let qT=null;
el.q.addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(()=>{const q=el.q.value;history.replaceState({},'','#s/'+encodeURIComponent(q));ctx.extra.q=q;ctx.ids=search(q);ctx.index=-1;renderList();},160);});
el.q.addEventListener('keydown',e=>{if(e.key==='Enter') el.q.blur();});

document.addEventListener('keydown',e=>{
  if(e.target===el.q||view==='list') return;
  if(e.key==='ArrowRight'){ ctx?step(1):goRandom(); }
  else if(e.key==='ArrowLeft'){ if(ctx) step(-1); }
  else if(e.key===' '){ e.preventDefault(); ctx?step(1):goRandom(); }
  else if(e.key==='b'||e.key==='B'){ el.bBm.click(); }
});
let tx=null,ty=null;
el.stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
el.stage.addEventListener('touchend',e=>{
  if(tx==null) return; const t=e.changedTouches[0]; const dx=t.clientX-tx, dy=t.clientY-ty; tx=ty=null;
  if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return;
  if(ctx) step(dx<0?1:-1); else if(dx<0) goRandom();
},{passive:true});

/* ---------- routing ---------- */
function route(){
  let h='';
  try{ h=decodeURIComponent(location.hash.slice(1)); }catch(e){ h=location.hash.slice(1); }
  if(!comics.length) return;
  const back=view==='viewer';
  if(!h){ goRandom(); return; }
  if(/^\d{3,5}$/.test(h)){
    const c=byId.get(h)||pageOf.get(h);
    if(!c){ toast('그 번호는 없어요'); goRandom(); return; }
    if(c.id!==h) history.replaceState(history.state,'','#'+c.id);
    const st=history.state;
    if(st&&st.ctx) ctx=rebuild(st.ctx,h);
    else if(ctx){ const i=ctx.ids.indexOf(h); if(i>=0) ctx.index=i; else ctx=null; }
    show(c); return;
  }
  if(h==='b'){ openList('browse',browseIds(),'열람',null,back); return; }
  if(h==='bm'){ openList('bm',[...bm],'북마크',null,back); return; }
  if(h.startsWith('bm/')){ const ids=h.slice(3).split(',').filter(id=>byId.has(id)); openList('import',ids,'받은 북마크',null,back); return; }
  if(h.startsWith('sim/')){
    const id=h.slice(4), c=byId.get(id); if(!c){goRandom();return;}
    let ids=similar(c), title='비슷한 만화';
    if(!ids.length){ ids=shuffle(comics.filter(o=>o!==c).map(o=>o.id),Math.random).slice(0,40); title='비슷한 걸 못 찾아서 아무거나'; }
    openList('sim',ids,title,{id},back); return;
  }
  if(h==='s'||h.startsWith('s/')){
    const q=h.startsWith('s/')?h.slice(2):'';
    openList('search',search(q),'검색',{q},back); el.search.classList.add('show'); el.q.value=q; if(!q) el.q.focus(); return;
  }
  goRandom();
}
window.addEventListener('hashchange',()=>{ el.search.classList.remove('show'); route(); });

load().then(route).catch(()=>{
  el.frame.classList.add('empty'); el.frame.textContent='목록(list.csv)을 못 읽었어요. 잠시 뒤 새로고침 해 보세요.'; el.stage.classList.add('show');
});
})();
</script>
